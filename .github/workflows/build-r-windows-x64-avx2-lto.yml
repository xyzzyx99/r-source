name: Build R Windows x64 AVX2 LTO

on:
  workflow_dispatch:
    inputs:
      svn_branch:
        description: 'Official R SVN branch'
        required: true
        default: 'R-4-6-branch'
        type: string
      run_checks:
        description: 'Run R base tests after compilation'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download and install Rtools45
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://cran.r-project.org/bin/windows/Rtools/rtools45/files/rtools45-6768-6492.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'rtools45.exe'
          $log = Join-Path $env:RUNNER_TEMP 'rtools45-install.log'
      
          Write-Host "Downloading Rtools45 from $url"
          & curl.exe --location --fail --show-error --progress-bar `
            --retry 4 --retry-all-errors --retry-delay 10 `
            --connect-timeout 30 --max-time 1800 `
            --output $installer $url
      
          if ($LASTEXITCODE -ne 0) {
              throw "Rtools45 download failed (curl exit $LASTEXITCODE)"
          }
      
          $size = (Get-Item $installer).Length
          Write-Host ("Downloaded Rtools45: {0:N1} MiB" -f ($size / 1MB))
      
          if ($size -lt 400MB) {
              throw 'Rtools45 download is unexpectedly small or incomplete'
          }

          $installDir = 'C:\rtools45'
          
          if (Test-Path -LiteralPath $installDir) {
              Write-Host "Removing existing Rtools45 directory..."
          
              Remove-Item -LiteralPath $installDir `
                  -Recurse -Force -ErrorAction Stop
          
              if (Test-Path -LiteralPath $installDir) {
                  throw "Failed to remove $installDir"
              }
          
              Write-Host "Directory removed successfully."
          }
          else {
              Write-Host "Directory does not exist. Clean installation."
          }
      
          Write-Host 'Installing Rtools45...'
      
          $p = Start-Process -FilePath $installer `
              -ArgumentList @(
                  '/VERYSILENT',
                  '/SUPPRESSMSGBOXES',
                  '/NORESTART',
                  '/SP-',
                  '/DIR=C:\rtools45',
                  "/LOG=$log"
              ) `
              -WindowStyle Hidden `
              -PassThru
      
          $null = $p.Handle
          Write-Host "Installer started. PID: $($p.Id)"
      
          $start = Get-Date
          $timeout = [TimeSpan]::FromMinutes(30)
      
          while ($true) {
              $p.Refresh()

      
              if ($p.HasExited) {
                  break
              }
      
              $elapsed = (Get-Date) - $start
      
              if ($elapsed -gt $timeout) {

                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  throw "Rtools45 installation timed out after 30 minutes."
              }

              $count = 0

              if (Test-Path -LiteralPath $installDir -PathType Container) {
                 $count = (Get-ChildItem -LiteralPath $installDir `
                    -File -Recurse -ErrorAction SilentlyContinue |
                    Measure-Object).Count
              }
     
              Write-Host ("{0} | Elapsed: {1:mm\:ss} | Files: {2}" -f `
                  (Get-Date -Format 'HH:mm:ss'), $elapsed, $count)
      
              Start-Sleep -Seconds 10

          }

          $p.WaitForExit()
          $exitCode = $p.ExitCode
      
          Write-Host "Installer exit code: $exitCode"
      
          if ($null -eq $exitCode -or $exitCode -ne 0) {
              if (Test-Path $log) {
                  Write-Host 'Last 80 installer log lines:'
                  Get-Content $log -Tail 80
              }
              throw "Rtools45 installation failed. Exit code: $exitCode"
          }
      
          if (-not (Test-Path 'C:\rtools45\usr\bin\bash.exe')) {
              throw 'Rtools45 MSYS2 bash was not installed'
          }
      
          Write-Host 'Rtools45 installation completed successfully.'


      - name: Refresh MSYS2 signing keys
        if: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\rtools45\usr\bin\bash.exe'
      
          Write-Host "Initializing and refreshing MSYS2 keyring..."
      
          & $bash --noprofile --norc -c `
            'export PATH=/usr/bin:/bin:$PATH; pacman-key --init && pacman-key --populate msys2 && pacman-key --refresh-keys'
      
          if ($LASTEXITCODE -ne 0) {
              throw "MSYS2 keyring refresh failed: $LASTEXITCODE"
          }
      
          Write-Host "MSYS2 keyring refreshed."



      - name: Initialize MSYS2 signing keys
        if: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\rtools45\usr\bin\bash.exe'
  
          Write-Host "Initializing MSYS2 keyring..."
  
          & $bash --noprofile --norc -c `
            'export PATH=/usr/bin:/bin:$PATH; pacman-key --init && pacman-key --populate msys2'
  
          if ($LASTEXITCODE -ne 0) {
              throw "MSYS2 keyring initialization failed: $LASTEXITCODE"
          }
  
          Write-Host "MSYS2 keyring initialized."


      - name: Update MSYS2 core packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\rtools45\usr\bin\bash.exe'

          Write-Host "Updating MSYS2 core packages..."

          & $bash --noprofile --norc -c `
            'export PATH=/usr/bin:/bin:$PATH; /usr/bin/pacman -Syuu --noconfirm'

          $code = $LASTEXITCODE
          Write-Host "First-stage exit code: $code"

          # A core runtime upgrade may terminate its own Bash process.
          # The next step verifies the installation using a fresh shell.
          if ($code -ne 0) {
              Write-Warning "First stage exited nonzero; checking in a fresh shell."
          }

      - name: Complete MSYS2 update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = 'C:\rtools45\usr\bin\bash.exe'

          Write-Host "Completing MSYS2 update in a fresh shell..."

          & $bash --noprofile --norc -c `
            'export PATH=/usr/bin:/bin:$PATH; /usr/bin/pacman -Syuu --noconfirm'

          if ($LASTEXITCODE -ne 0) {
              throw "MSYS2 second-stage update failed: $LASTEXITCODE"
          }

          Write-Host "MSYS2 update completed successfully."

      - name: Install MSYS build utilities
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/bin:/bin:$PATH

          pacman -S --noconfirm --needed subversion wget unzip rsync

          echo "Checking Subversion..."
          svn --version --quiet


      - name: Fetch R source and matching Tcl/Tk bundle
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        env:
          R_BRANCH: ${{ inputs.svn_branch }}
        run: |
          export PATH=/usr/bin:/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          svn checkout --depth infinity "https://svn.r-project.org/R/branches/${R_BRANCH}" r-source
          wget -qO listing.html https://cran.r-project.org/bin/windows/Rtools/rtools45/files/
          TCLBUNDLE=$(grep -oE 'tcltk-[0-9]+-[0-9]+\.zip' listing.html | head -n1)
          test -n "$TCLBUNDLE"
          wget -q "https://cran.r-project.org/bin/windows/Rtools/rtools45/files/$TCLBUNDLE" -O tcltk.zip
          cd r-source
          unzip -q ../tcltk.zip

      - name: Configure AVX2, FMA and link-time optimization
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source/src/gnuwin32"
          cat > MkRules.local <<'EOF'
          #EOPTS = -O2 -mavx2 -mfma -mstackrealign
          EOPTS = -O2 -mavx2  
          #LTO = -flto
          LTO =
          #LTO_OPT = -flto
          LTO_OPT =
          EOF
          cat MkRules.local

      - name: Compile R and recommended packages
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:/usr/bin:/bin:$PATH
          export TAR=/usr/bin/tar
          export TAR_OPTIONS=--force-local
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source/src/gnuwin32"
          gcc --version
          make rsync-recommended
          make -j 2 all recommended || make all recommended
          test -f ../../bin/x64/Rterm.exe

      - name: Smoke test R
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:/usr/bin:/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source"
          ./bin/R --vanilla -q -e 'print(R.version.string); stopifnot(sum(1:10) == 55)'


      - name: Test R approximate string matching
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rterm = Join-Path $env:GITHUB_WORKSPACE 'r-source\bin\x64\Rterm.exe'
  
          & $rterm --vanilla --slave -e 'print(agrep("lasy", "1 lazy 2"))'
          $code = $LASTEXITCODE
  
          Write-Host "agrep exit code: $code"
  
          if ($code -ne 0) {
              throw "R agrep test failed with exit code $code"
          }


      - name: Run base tests
        if: ${{ inputs.run_checks }}
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:/usr/bin:/bin:$PATH
          export TAR=/usr/bin/tar
          export TAR_OPTIONS=--force-local
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source/src/gnuwin32"
          make check


      - name: Upload R test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: R-Test-Diagnostics
          path: |
            r-source/tests/**/*.Rout.fail
            r-source/tests/**/*.Rout
            r-source/tests/**/*.log
          if-no-files-found: warn
          retention-days: 14


      - name: Upload compiled R (build tree, not installer)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: R-Windows-x64-AVX2-LTO
          path: |
            r-source/bin/
            r-source/etc/
            r-source/library/
            r-source/modules/
            r-source/share/
            r-source/doc/
            r-source/src/gnuwin32/MkRules.local
          if-no-files-found: error
          retention-days: 14
