name: Build R Windows x64 AVX2 LTO

on:
  workflow_dispatch:
    inputs:
      svn_branch:
        description: 'Official R SVN branch'
        required: true
        default: 'R-4-6-branch'
        type: string
      run_checks:
        description: 'Run R base tests after compilation'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download and install Rtools45
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://cran.r-project.org/bin/windows/Rtools/rtools45/files/rtools45-6768-6492.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'rtools45.exe'
          $log = Join-Path $env:RUNNER_TEMP 'rtools45-instal.log'

          Write-Host "Downloading Rtools45 from $url"
          & curl.exe --location --fail --show-error --progress-bar `
            --retry 4 --retry-all-errors --retry-delay 10 `
            --connect-timeout 30 --max-time 1800 `
            --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Rtools45 download failed (curl exit $LASTEXITCODE)" }
          $size = (Get-Item $installer).Length
          Write-Host ("Downloaded Rtools45: {0:N1} MiB" -f ($size / 1MB))
          if ($size -lt 400MB) { throw 'Rtools45 download is unexpectedly small or incomplete' }
          Write-Host 'Installing Rtools45...'
          $p = Start-Process -FilePath $installer `
              -ArgumentList @(
                  '/VERYSILENT',
                  '/SUPPRESSMSGBOXES',
                  '/NORESTART',
                  '/SP-',
                  '/DIR=C:\rtools45',
                  "/LOG=$log"
              ) `
             -RedirectStandardOutput "$env:RUNNER_TEMP\rtools-stdout.log" `
             -RedirectStandardError "$env:RUNNER_TEMP\rtools-stderr.log" `
             -WindowStyle Hidden `
             -PassThru

          $null = $p.Handle

          Write-Host "Rtools45 installer started. PID: $($p.Id)"
          
          while (-not $p.HasExited) {
              $p.Refresh()
          
              if (Test-Path $log) {
               	$count = (Get-ChildItem C:\rtools45 -File -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count
              	Write-Host "$(Get-Date -Format 'HH:mm:ss'): $count files"
          
              }
          
              Write-Host "Installer running... $(Get-Date -Format 'HH:mm:ss')"
              Start-Sleep -Seconds 10
          
          }

          $p.WaitForExit()
          $exitCode = $p.ExitCode
          #Write-Host "Installer exit code: $exitCode"

#          if ($p.ExitCode -ne 0) { throw "Rtools45 installer exited with $($p.ExitCode)" }
          if ($exitCode -ne 0) { throw "Rtools45 installer exited with $exitCode" }
          if (-not (Test-Path 'C:\rtools45\usr\bin\bash.exe')) { throw 'Rtools45 MSYS2 bash was not installed' }

      - name: Install MSYS build utilities
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/usr/bin:/bin:$PATH
          pacman -Sy --noconfirm --needed subversion wget unzip rsync

      - name: Fetch R source and matching Tcl/Tk bundle
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        env:
          R_BRANCH: ${{ inputs.svn_branch }}
        run: |
          export PATH=/usr/bin:/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          svn checkout --depth infinity "https://svn.r-project.org/R/branches/${R_BRANCH}" r-source
          wget -qO listing.html https://cran.r-project.org/bin/windows/Rtools/rtools45/files/
          TCLBUNDLE=$(grep -oE 'tcltk-[0-9]+-[0-9]+\.zip' listing.html | head -n1)
          test -n "$TCLBUNDLE"
          wget -q "https://cran.r-project.org/bin/windows/Rtools/rtools45/files/$TCLBUNDLE" -O tcltk.zip
          cd r-source
          unzip -q ../tcltk.zip

      - name: Configure AVX2, FMA and link-time optimization
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source/src/gnuwin32"
          cat > MkRules.local <<'EOF'
          EOPTS = -O2 -mavx2 -mfma -mstackrealign
          LTO = -flto
          LTO_OPT = -flto
          EOF
          cat MkRules.local

      - name: Compile R and recommended packages
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:/usr/bin:/bin:$PATH
          export TAR=/usr/bin/tar
          export TAR_OPTIONS=--force-local
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source/src/gnuwin32"
          gcc --version
          make rsync-recommended
          make -j 2 all recommended || make all recommended
          test -f ../../bin/x64/Rterm.exe

      - name: Smoke test R
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:/usr/bin:/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source"
          ./bin/R --vanilla -q -e 'print(R.version.string); stopifnot(sum(1:10) == 55)'

      - name: Run base tests
        if: ${{ inputs.run_checks }}
        shell: C:\rtools45\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH=/x86_64-w64-mingw32.static.posix/bin:/usr/bin:/bin:$PATH
          export TAR=/usr/bin/tar
          export TAR_OPTIONS=--force-local
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/r-source/src/gnuwin32"
          make check

      - name: Upload compiled R (build tree, not installer)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: R-Windows-x64-AVX2-LTO
          path: |
            r-source/bin/
            r-source/etc/
            r-source/library/
            r-source/modules/
            r-source/share/
            r-source/doc/
            r-source/src/gnuwin32/MkRules.local
          if-no-files-found: error
          retention-days: 14
